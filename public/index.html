<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const t = localStorage.getItem('season:theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="page">
    <header class="head">
      <div>
        <h1 id="date">Loading…</h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="head-actions">
        <span class="meta" id="updated"></span>
        <button type="button" class="btn" id="sync" title="Sync with your other computer (S)" hidden><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Sync</span></button>
        <button type="button" class="btn" id="refresh" title="Refresh (R)">Refresh</button>
        <button type="button" class="btn" id="open-palette" title="Jump (⌘K)">Jump <kbd>⌘K</kbd></button>
      </div>
    </header>
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
    <div class="banner" id="banner" hidden></div>

    <main class="cols">
      <section class="col-main">
        <div class="sec-head">
          <h2 id="week-title">This week</h2>
          <div class="nav">
            <button type="button" class="btn icon" id="week-prev" aria-label="Previous week">‹</button>
            <button type="button" class="btn" id="week-today">Today</button>
            <button type="button" class="btn icon" id="week-next" aria-label="Next week">›</button>
          </div>
        </div>
        <div id="agenda" class="agenda"></div>

        <div class="sec-head">
          <h2>Coming up</h2>
          <span class="meta" id="later-meta"></span>
        </div>
        <div id="later" class="list"></div>
      </section>

      <aside class="col-side">
        <section>
          <div class="sec-head"><h2>School</h2><span class="meta" id="courses-meta"></span></div>
          <div id="courses" class="list"></div>
          <div id="announcements" class="list"></div>
        </section>
        <section>
          <div class="sec-head"><h2>Projects</h2><span class="meta" id="projects-meta"></span></div>
          <div id="projects" class="list"></div>
        </section>
        <section>
          <div class="sec-head"><h2>Recent files</h2><button type="button" class="linkish" id="files-more">Show all</button></div>
          <div id="files" class="list"></div>
        </section>
      </aside>
    </main>
  </div>

  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Jump">
      <input id="palette-input" type="text" placeholder="Jump to a course, deadline, project, or file…" aria-label="Search" autocomplete="off" spellcheck="false">
      <ul id="palette-list" role="listbox"></ul>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
