<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Season</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F4FD8'/%3E%3Cpath d='M7 22 L13 12 L19 19 L25 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('season:theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <a class="skip" href="#week">Skip to this week</a>

  <header class="top" id="top">
    <div class="brand">
      <span class="wordmark">Season</span>
      <span class="term" id="term">—</span>
    </div>
    <div class="today" id="today" aria-live="polite">Loading the board…</div>
    <div class="tools">
      <div class="focus" id="focus" title="Focus timer">
        <button class="focus-btn" id="focus-toggle" type="button" aria-label="Start a 25 minute focus block">
          <span class="focus-time" id="focus-time">25:00</span>
          <span class="focus-label" id="focus-label">Focus</span>
        </button>
        <span class="focus-count" id="focus-count" title="Focus blocks finished today"></span>
      </div>
      <button class="tool" id="refresh" type="button" title="Pull fresh data (R)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span id="updated">updating</span>
      </button>
      <button class="tool" id="open-palette" type="button" title="Jump anywhere (⌘K)"><kbd>⌘K</kbd> Jump</button>
      <button class="tool icon" id="theme" type="button" aria-label="Switch between whiteboard and chalkboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18 9 9 0 0 1 0-18z" fill="currentColor"/><circle cx="12" cy="12" r="9"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="strip" aria-label="Semester overview">
    <div class="strip-head">
      <h2 class="eyebrow">The season</h2>
      <div class="legend" aria-hidden="true">
        <span><i class="dot due"></i> due</span>
        <span><i class="dot done"></i> done</span>
        <span><i class="dot late"></i> overdue</span>
        <span><i class="dot event"></i> event</span>
      </div>
    </div>
    <div class="strip-scroll"><svg id="season-strip" class="season-strip" role="img" aria-label="Every deadline this semester, plotted by week" preserveAspectRatio="none"></svg></div>
  </section>

  <main class="board">
    <section class="panel week" id="week" aria-labelledby="week-title">
      <div class="panel-head">
        <h2 id="week-title" class="panel-title">Game plan</h2>
        <div class="week-nav">
          <button type="button" class="tool icon" id="week-prev" aria-label="Previous week">‹</button>
          <button type="button" class="tool" id="week-today">This week</button>
          <button type="button" class="tool icon" id="week-next" aria-label="Next week">›</button>
        </div>
      </div>
      <div class="week-grid" id="week-grid"></div>
    </section>

    <section class="panel deck" id="deck" aria-labelledby="deck-title">
      <div class="panel-head">
        <h2 id="deck-title" class="panel-title">On deck</h2>
        <span class="panel-meta" id="deck-meta"></span>
      </div>
      <div id="deck-list" class="deck-list"></div>
    </section>

    <section class="panel courses" id="courses" aria-labelledby="courses-title">
      <div class="panel-head">
        <h2 id="courses-title" class="panel-title">Courses</h2>
        <span class="panel-meta" id="courses-meta"></span>
      </div>
      <div id="course-grid" class="course-grid"></div>
    </section>

    <section class="panel projects" id="projects" aria-labelledby="projects-title">
      <div class="panel-head">
        <h2 id="projects-title" class="panel-title">Projects</h2>
        <span class="panel-meta" id="projects-meta"></span>
      </div>
      <div id="project-list" class="project-list"></div>
    </section>

    <section class="panel announce" id="announce" aria-labelledby="announce-title">
      <div class="panel-head">
        <h2 id="announce-title" class="panel-title">Announcements</h2>
        <span class="panel-meta" id="announce-meta"></span>
      </div>
      <div id="announce-list" class="announce-list"></div>
    </section>

    <section class="panel files" id="files" aria-labelledby="files-title">
      <div class="panel-head">
        <h2 id="files-title" class="panel-title">Recent files</h2>
        <span class="panel-meta" id="files-meta"></span>
      </div>
      <div id="file-list" class="file-list"></div>
    </section>

    <section class="panel pins" id="pins" aria-labelledby="pins-title">
      <div class="panel-head">
        <h2 id="pins-title" class="panel-title">Pinned</h2>
      </div>
      <div id="pin-list" class="pin-list"></div>
      <form id="pin-form" class="pin-form" autocomplete="off">
        <input name="label" placeholder="Label" aria-label="Pin label" maxlength="60" required>
        <input name="url" placeholder="https://… or ~/path" aria-label="Pin link or path" maxlength="500" required>
        <button type="submit" class="tool">Pin</button>
      </form>
    </section>
  </main>

  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Jump anywhere">
      <input id="palette-input" type="text" placeholder="Jump to a course, deadline, project, file, or action…" aria-label="Search" autocomplete="off" spellcheck="false">
      <ul id="palette-list" role="listbox"></ul>
      <div class="palette-hint"><kbd>↑↓</kbd> move <kbd>↵</kbd> open <kbd>esc</kbd> close</div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
